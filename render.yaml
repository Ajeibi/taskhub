# Render Blueprint: one click from the GitHub repo to a live HTTPS URL (web service + managed Postgres).
# Steps are in deploy/README.md ("Hosted demo on Render").
#
# Demo-grade choices, on purpose:
#  - Migrations run in the start command. That is safe for ONE instance (the migrator takes a Postgres advisory lock,
#    and every file is applied in a transaction). With several replicas use a separate Job/pre-deploy step instead,
#    as deploy/k8s does.
#  - Free plans sleep when idle and the free database is time-limited: fine for a review, not for production.
databases:
  - name: taskhub-db
    plan: free
    databaseName: taskhub
    user: taskhub

services:
  - type: web
    name: taskhub
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "node dist/migrate-cli.js && node dist/index.js"
    healthCheckPath: /readyz          # 200 only when the database is reachable
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: taskhub-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true           # random per deployment; never stored in the repo
      - key: COOKIE_SECURE
        value: "true"                 # Render terminates HTTPS
      - key: PORT
        value: "8080"
      - key: METRICS_PORT
        value: "0"                    # no second listener on a platform that only routes one port
