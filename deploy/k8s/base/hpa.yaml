apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels: { taskhub.io/stage: app }
  name: taskhub
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: taskhub }
  minReplicas: 2
  maxReplicas: 10                   # capped by the database connection budget (see DB_POOL_MAX), not by the app
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }   # % of the CPU *request*; needs metrics-server
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{ type: Pods, value: 2, periodSeconds: 60 }]   # react fast to spikes
    scaleDown:
      stabilizationWindowSeconds: 300                           # scale in slowly to avoid flapping
      policies: [{ type: Pods, value: 1, periodSeconds: 120 }]
