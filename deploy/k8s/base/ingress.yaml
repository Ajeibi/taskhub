apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels: { taskhub.io/stage: app }
  name: taskhub
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m          # API bodies are tiny; cap at the edge too
    nginx.ingress.kubernetes.io/limit-rps: "20"              # per-client-IP limit shared by ALL pods (the in-app limiter is per pod)
spec:
  ingressClassName: nginx
  tls:
    - hosts: [taskhub.example.com]
      secretName: taskhub-tls        # issued by cert-manager (or supplied) in real environments
  rules:
    - host: taskhub.example.com      # replaced per environment
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: taskhub, port: { name: http } }
