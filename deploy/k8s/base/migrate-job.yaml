# Schema migrations run ONCE per release, before the new app version rolls out, as their own Job:
#   kubectl delete job taskhub-migrate --ignore-not-found; kubectl apply -k <overlay> -l taskhub.io/stage=migrate
#   kubectl wait --for=condition=complete job/taskhub-migrate   ... and only THEN apply the app stage (see deploy/README.md)
# Never inside every replica at startup: N pods racing to alter the schema is how outages happen.
# (The migration runner also takes a Postgres advisory lock, so an accidental overlap is still safe.)
apiVersion: batch/v1
kind: Job
metadata:
  name: taskhub-migrate
  labels: { app.kubernetes.io/name: taskhub, app.kubernetes.io/component: migrate, taskhub.io/stage: migrate }
spec:
  backoffLimit: 3                   # retry transient failures (e.g. DB still starting)
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600     # clean up an hour after finishing; delete before re-applying (Job specs are immutable)
  template:
    metadata:
      labels: { app.kubernetes.io/name: taskhub, app.kubernetes.io/component: migrate }
    spec:
      restartPolicy: OnFailure
      serviceAccountName: taskhub
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: taskhub:local      # the SAME image as the app: the schema and the code that expects it ship together
          command: ["node", "dist/migrate-cli.js"]
          envFrom:
            - configMapRef: { name: taskhub-config }
            - secretRef: { name: taskhub-secrets }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
