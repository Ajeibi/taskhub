apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskhub
  labels: { app.kubernetes.io/name: taskhub, app.kubernetes.io/component: app, taskhub.io/stage: app }
spec:
  replicas: 2                      # >= 2 so one pod can die or be drained without downtime; the HPA takes over from here
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0            # never reduce capacity during a deploy...
      maxSurge: 1                  # ...add the new pod first, wait until it is Ready, then retire an old one
  selector:
    matchLabels: { app.kubernetes.io/name: taskhub, app.kubernetes.io/component: app }
  template:
    metadata:
      labels: { app.kubernetes.io/name: taskhub, app.kubernetes.io/component: app }
    spec:
      serviceAccountName: taskhub
      automountServiceAccountToken: false   # the app never talks to the Kubernetes API
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # Spread replicas over nodes (and zones when available) so one node failure cannot take every pod.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: taskhub, app.kubernetes.io/component: app }
      containers:
        - name: app
          image: taskhub:local                # replaced per environment by the kustomize `images:` transformer
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: taskhub-config }
            - secretRef: { name: taskhub-secrets }   # DATABASE_URL, JWT_SECRET
          resources:
            requests: { cpu: 100m, memory: 160Mi }   # what the scheduler reserves, and what the HPA's CPU % is measured against
            limits: { memory: 320Mi }                # memory limit protects the node; no CPU limit avoids needless throttling
          # startupProbe gives a slow start time without loosening liveness afterwards.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # Liveness never checks the database: a DB outage must not make Kubernetes restart healthy pods.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness does check the database: the pod leaves the Service until the DB is reachable again.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }   # let endpoint removal propagate before SIGTERM, so no request hits a closing pod
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
