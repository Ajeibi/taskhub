# Non-secret configuration. Secrets (DATABASE_URL, JWT_SECRET) live in the `taskhub-secrets` Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  labels: { taskhub.io/stage: prereq }
  name: taskhub-config
data:
  NODE_ENV: production
  PORT: "8080"
  LOG_LEVEL: info
  COOKIE_SECURE: "true"             # production traffic is HTTPS (terminated at the Ingress)
  ACCESS_TOKEN_TTL_SECONDS: "900"
  REFRESH_TOKEN_TTL_DAYS: "7"
  AUTH_RATE_LIMIT_MAX: "20"
  # Pool size PER POD. Total DB connections = replicas x this. With HPA max 10 pods: 10 x 8 = 80,
  # which must stay below Postgres max_connections (default 100). Beyond that, add PgBouncer.
  DB_POOL_MAX: "8"
