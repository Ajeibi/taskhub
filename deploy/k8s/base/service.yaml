apiVersion: v1
kind: Service
metadata:
  name: taskhub
  labels: { app.kubernetes.io/name: taskhub, app.kubernetes.io/component: app, taskhub.io/stage: app }
spec:
  type: ClusterIP                   # exposed to the outside only through the Ingress
  selector: { app.kubernetes.io/name: taskhub, app.kubernetes.io/component: app }
  ports:
    - { name: http, port: 80, targetPort: http }
