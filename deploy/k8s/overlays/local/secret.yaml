# DEVELOPMENT VALUES ONLY. In real environments this object is not stored in git: it is created by
# External Secrets / Sealed Secrets / the cloud secret manager, with the same keys.
apiVersion: v1
kind: Secret
metadata:
  name: taskhub-secrets
  labels: { taskhub.io/stage: prereq }
type: Opaque
stringData:
  DATABASE_URL: postgres://taskhub:taskhub-local-only@postgres:5432/taskhub
  JWT_SECRET: local-k8s-dev-only-secret-change-me-0123456789abcdef
  POSTGRES_PASSWORD: taskhub-local-only
