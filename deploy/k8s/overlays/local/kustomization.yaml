# Local/demo environment (Docker Desktop Kubernetes, kind, minikube). NOT for production: it runs a
# single-replica Postgres in the cluster and uses throwaway development secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taskhub
resources:
  - namespace.yaml
  - ../../base
  - postgres.yaml
  - secret.yaml
images:
  - name: taskhub
    newName: taskhub
    newTag: local              # build with: docker build -t taskhub:local .   (kind: also `kind load docker-image taskhub:local`)
patches:
  - target: { kind: Ingress, name: taskhub }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: taskhub.localhost
      - op: replace
        path: /spec/tls/0/hosts/0
        value: taskhub.localhost
  - target: { kind: ConfigMap, name: taskhub-config }
    patch: |-
      - op: replace
        path: /data/COOKIE_SECURE
        value: "false"          # local ingress is plain http
  - target: { kind: Deployment, name: taskhub }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
