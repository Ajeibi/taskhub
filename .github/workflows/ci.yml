name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: taskhub, POSTGRES_PASSWORD: taskhub, POSTGRES_DB: taskhub_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskhub" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://taskhub:taskhub@localhost:5432/taskhub_test
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test            # integration tests run against a real PostgreSQL, using the real migrations

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build       # typechecks, then produces the production bundle

  e2e:
    needs: [server, web]
    runs-on: ubuntu-latest
    env:
      AUTH_RATE_LIMIT_MAX: "1000"       # the suite signs up many users from one IP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: e2e/package-lock.json }
      - name: Start the full stack (db, migrations, app)
        run: docker compose up -d --build --wait app
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - name: Keep traces and screenshots when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-results, path: e2e/test-results }
      - if: always()
        run: docker compose logs app | tail -100

  image:
    needs: [server, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed from CI in this repo; add a registry login + push step per environment)
        uses: docker/build-push-action@v6
        with: { context: ., push: false, tags: "taskhub:${{ github.sha }}", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Render Kubernetes manifests
        run: kubectl kustomize deploy/k8s/overlays/local > /dev/null
